name: warp_tools
on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作: list 列出所有 WARP 设备 / delete 删除设备'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - delete
      device_name:
        description: '要删除的设备名称 (action=delete 时必填)'
        required: false
        type: string

jobs:
  warp-tools:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/horacecuiorg/dockerfile/ubuntu2204:githubrunner
    env:
      UPSTASH_REST_URL: ${{ secrets.UPSTASH_REST_URL }}
      UPSTASH_REST_TOKEN_RO: ${{ secrets.UPSTASH_REST_TOKEN_RO }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 运行 WARP 工具
        run: |
          python3 scripts/warp_tools.py "${{ github.event.inputs.action }}" "${{ github.event.inputs.device_name }}"
